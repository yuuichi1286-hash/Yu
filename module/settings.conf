# =====================================================================
#  Mic Boost + AI Noise Suppression - pengaturan / settings
# ---------------------------------------------------------------------
#  1 = aktif / on, 0 = mati / off. Setelah mengubah, pasang ulang modul
#  (zip yang sama) lalu reboot. Pengaturan ini dipertahankan saat update.
#  After editing, reinstall the module zip and reboot. Kept on updates.
#  Tombol "Action" di Magisk/KernelSU/APatch: AI NS on/off tanpa reboot.
# =====================================================================

# --- AI noise suppression (RNNoise, gaya Krisp/Discord) ----------------
# Untuk voice note, rekam suara, voice typing dan telepon internet/open mic.
# Diproses langsung oleh HAL audio di HP yang menjalankan efek software
# (MediaTek, Unisoc, dll).
# Di Qualcomm peredam bisingnya dikerjakan DSP (lihat FLUENCE di bawah).
AI_NS=1
# Kekuatan peredam 0-100 (90 = kuat, 100 = maksimal, 60 = lembut)
NS_STRENGTH=90
# Peredam tahap kedua (filter Wiener) setelah AI: sisa bising kipas,
# keyboard, mesin ditekan lagi 2-10 dB. 0 jika suara terasa "tipis".
NS_POSTFILTER=1
# Senyapkan jeda saat tidak bicara (voice gate) dan kedalamannya (dB)
VOICE_GATE=1
VOICE_GATE_DB=18
# Potong dengung/gemuruh di bawah 80 Hz
VOICE_LOWCUT=1
# Suara lebih jelas: kurangi "bloom" 250 Hz, presence 3 kHz +4 dB, "air" 5 kHz +4 dB
VOICE_CLARITY=1
# Penyeimbang volume otomatis: suara pelan diangkat (maks +12 dB)
VOICE_LEVELER=1
# Gain tambahan tetap, -12 sampai 12 dB
VOICE_GAIN_DB=0

# --- Suara bass / deep yang natural ------------------------------------
# Suara lebih berat dan dalam saat bicara: nada diturunkan sedikit, warna
# suara (formant) ikut turun tipis supaya tetap terdengar seperti suara
# asli (bukan robot / slow motion), dan bass sekitar 150 Hz diangkat.
# Berlaku untuk rekam, voice note dan telepon internet (bukan voice typing).
VOICE_DEEP=1
# Turunkan nada (semitone): -1 halus, -2.5 natural (disarankan), -3 berat,
# -4 sampai -6 sangat berat. 0 = nada asli (hanya bass + formant)
DEEP_PITCH=-2.5
# Geser formant (persen): -5 = dada terdengar lebih "besar", 0 = asli.
# Lebih rendah dari -8 mulai terdengar tidak natural.
DEEP_FORMANT=-5
# Tambahan bass di 150 Hz (dB): 0-12, 5 = besar, hangat dan berisi
DEEP_BASS=5

# --- Jalur rekam yang diberi noise suppression ------------------------
# Rekam video / kamera (0 = suara sekitar tetap alami)
NS_CAMCORDER=0
# Telepon internet (WhatsApp, Telegram, Discord, Meet, Zoom):
# peredam gema (AEC) + noise suppression bawaan HP
NS_VOIP=1
# AI noise suppression + suara deep juga di telepon internet / open mic
# (Discord, WhatsApp, game), dipasang setelah peredam gema bawaan HP
NS_VOIP_AI=1

# --- HP Qualcomm: AI NS + suara deep lewat HAL hook ----------------------
# HAL audio Qualcomm tidak menjalankan efek software, jadi modul memasang
# pembungkus kecil di depan driver audio (audio.primary.*.so) supaya suara
# mic tetap diproses AI NS, suara deep dan EQ jernih.
# auto  = aktif di HP Qualcomm (disarankan)
# force = coba juga di HP lain / setelah dimatikan otomatis
# off   = jangan pasang
# Pengaman: bila audio tidak jalan atau terus restart, hook mati sendiri.
HAL_HOOK=auto

# --- Qualcomm Fluence: peredam bising multi-mic di DSP -----------------
# Untuk telepon biasa, speaker, voice typing dan rekaman.
# auto  = aktif jika HP mendukung (disarankan)
# force = paksa aktif walau HP tidak mengumumkan dukungan (eksperimen)
# off   = biarkan bawaan
FLUENCE=auto
# Fluence juga saat merekam / voice note (0 jika rekaman jadi terlalu pelan)
FLUENCE_RECORD=1

# --- Mi A2 Lite (daisy) -----------------------------------------------
# Mixer asli modul ini: mic volume boost + tukar mic kiri/kanan stereo.
# auto = hanya di Mi A2 Lite, force = pasang walau bukan daisy, off = jangan
A2L_MIXER=auto
